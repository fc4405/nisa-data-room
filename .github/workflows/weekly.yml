name: weekly-analysis

# 毎週月曜 9:00(JST): サイト点検・Search Console分析 → レポート更新 → トピック補充
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 週次分析
        run: python scripts/analyze.py

      - name: 新しいトピックを提案（未着手が少ないときのみ意味があります）
        if: env.ANTHROPIC_API_KEY != ''
        run: python scripts/generate_article.py --propose || echo "トピック提案に失敗（続行）"

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data content/topics.yaml
          git diff --cached --quiet || { git commit -m "auto: weekly report $(TZ=Asia/Tokyo date +%F)"; git push; }
