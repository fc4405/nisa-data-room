name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["reports/**", "data/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install Jinja2 Markdown PyYAML
      - run: python -m unittest discover -s tests
      - run: python scripts/quality_gate.py
      - run: python scripts/build.py --local
