<form class="calc" data-tool="fee-impact" novalidate>
  <div class="grid2">
    <label>毎月の積立額（円）<input type="number" name="monthly" value="30000" min="0" step="1000" inputmode="numeric"></label>
    <label>運用期間（年）<input type="number" name="years" value="30" min="1" max="60" step="1" inputmode="numeric"></label>
    <label>運用前の想定年利（%）<input type="number" name="rate" value="5" min="-20" max="30" step="0.1" inputmode="decimal"></label>
    <span></span>
    <label>商品Aの年間コスト（%）<input type="number" name="feeA" value="0.1" min="0" max="5" step="0.01" inputmode="decimal"></label>
    <label>商品Bの年間コスト（%）<input type="number" name="feeB" value="1.0" min="0" max="5" step="0.01" inputmode="decimal"></label>
  </div>
  <p class="hint">年間コストは信託報酬（運用管理費用）などの目安です。実際の総コストは目論見書・運用報告書でご確認ください。</p>
</form>
<section class="result" aria-live="polite" data-result="fee-impact"></section>
